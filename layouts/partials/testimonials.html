{{ $quotes := false }}
{{ with try hugo.Data.testimonials }}
  {{ if not .Err }}{{ $quotes = .Value }}{{ end }}
{{ end }}
{{ if not $quotes }}{{ $quotes = site.Data.testimonials }}{{ end }}

<div class="reviews-embed" data-elfsight-embed="{{ site.Params.social.elfsightReviews }}">
  <noscript>
    <div class="quote-grid">
      {{ range $quotes }}
        <blockquote>
          <p>{{ .quote }}</p>
          <footer>
            <cite>{{ .name }}</cite>
          </footer>
        </blockquote>
      {{ end }}
    </div>
  </noscript>
</div>
