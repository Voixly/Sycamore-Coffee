{{/* Honeypot: bots fill it in, humans cannot see it, /api/form drops those. */}}
<div class="hp" aria-hidden="true">
  <label>Leave this field empty<input type="text" name="_honey" tabindex="-1" autocomplete="off"></label>
</div>
<div
  class="cf-turnstile"
  data-turnstile-host
  data-action="turnstile-spin-v1"
  {{ with site.Params.turnstileSiteKey }}data-sitekey="{{ . }}"{{ end }}
></div>
<p class="form-status" data-form-status aria-live="polite" hidden></p>
<template data-form-fail>
  Something went wrong and your message was not sent. Please
  <a href="mailto:{{ site.Params.email }}">email</a>
  or
  <a href="{{ site.Params.phoneHref | safeURL }}">call us</a>.
</template>
